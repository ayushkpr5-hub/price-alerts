name: India Market Alert

on:
  schedule:
    # Every 5 minutes during Indian market hours (9:15-15:30 IST = 3:45-10:00 UTC)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  india-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance numpy pandas

      # Nothing here may print a secret, or any part of one. This repository is
      # public, so its Actions logs are public too.
      - name: Run India Market Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          import alert_engine
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not token or not chat_id:
              sys.exit('TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing. Set both under Settings, Secrets and variables, Actions.')
          print(f'Secrets present: token {len(token)} chars, chat id {len(chat_id)} chars.')
          config = alert_engine.load_config()
          config['telegram_bot_token'] = token
          config['telegram_chat_id'] = chat_id
          alert_engine.check_alerts(config, alert_engine.load_state())
          if alert_engine.SEND_FAILURES:
              sys.exit('Telegram delivery failed, so nothing reached the phone: ' + '; '.join(sorted(set(alert_engine.SEND_FAILURES))))
          print('Done.')
          "
