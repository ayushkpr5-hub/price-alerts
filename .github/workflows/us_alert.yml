name: US Market Alert

on:
  schedule:
    # 7:30 PM IST = 14:00 UTC (Mon-Fri)
    - cron: '0 14 * * 1-5'
    # 11:00 PM IST = 17:30 UTC (Mon-Fri)
    - cron: '30 17 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  us-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance numpy pandas

      # Nothing here may print a secret, or any part of one. This repository is
      # public, so its Actions logs are public too. An earlier version of this
      # step printed token[:10], which published the bot id on every run.
      - name: Run US Market Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          import alert_engine
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not token or not chat_id:
              sys.exit('TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing. Set both under Settings, Secrets and variables, Actions.')
          print(f'Secrets present: token {len(token)} chars, chat id {len(chat_id)} chars.')
          alert_engine.run_us_daily_check(token, chat_id)
          if alert_engine.SEND_FAILURES:
              sys.exit('Telegram delivery failed, so nothing reached the phone: ' + '; '.join(sorted(set(alert_engine.SEND_FAILURES))))
          print('Done.')
          "
